<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Bug Reporter — Triage Dashboard</title>
  <script>
    // The theme is set before the page draws, so a dark-theme user never sees a light flash. Same rule as
    // campus.codes: the saved choice, otherwise the system setting.
    try {
      var stored = localStorage.getItem('lab-dashboard.theme');
      var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (isDark) document.documentElement.classList.add('dark');
    } catch (error) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
