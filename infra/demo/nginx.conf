# Main config of the demo website's nginx. It is replaced whole only to load njs, which the hanging endpoint needs.
load_module modules/ngx_http_js_module.so;

worker_processes 1;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    js_import demo_api from /etc/nginx/njs/demo-api.js;

    # The nginx image renders templates/*.template into conf.d/ with the environment variables filled in.
    include /etc/nginx/conf.d/*.conf;
}
