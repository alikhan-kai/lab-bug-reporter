services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:4.03
    restart: unless-stopped
    command: "server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data"
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - seaweedfs_data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # The service creates its bucket on startup, so it waits until the S3 gateway answers.
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz" ]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    command: start-dev --import-realm
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      # The address browsers use. It becomes the token issuer, so the service checks tokens against it.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Filled into the dashboard client's redirect URIs when the realm is imported.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  # The reporter service: ingest and dashboard API, sdk.js and the dashboard on one port.
  server:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      OIDC_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/lab-bug-reporter
      # Keys come over the Docker network; the issuer above stays the public address.
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/lab-bug-reporter/protocol/openid-connect/certs
      PROJECTS_FILE: file:/app/config/projects.yaml
    volumes:
      - ./server/src/main/resources/projects-dev.yaml:/app/config/projects.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      keycloak:
        condition: service_started

  # The demo lab website with the SDK, on its own origin like a real site.
  demo:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "5500:80"
    environment:
      # Where the demo page sends its reports: the address browsers use to reach the service.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    volumes:
      - ./demo:/usr/share/nginx/html/demo:ro
      - ./infra/demo/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/demo/templates:/etc/nginx/templates:ro
      - ./infra/demo/njs:/etc/nginx/njs:ro
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
  seaweedfs_data:
