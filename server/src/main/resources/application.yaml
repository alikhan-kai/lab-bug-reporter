server:
  port: ${PORT:8080}
  tomcat:
    max-swallow-size: -1

spring:
  config:
    # Lets the backend start from the IDE, whichever of the two working directories it uses.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 260MB

  application:
    name: server

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  datasource:
    # A JDBC URL, for example jdbc:postgresql://postgres:5432/reporter inside Docker Compose.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB}}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8081/realms/lab-bug-reporter}
          # Set separately so the service can fetch keys over the Docker network while the
          # tokens keep the public issuer. It also keeps startup independent of Keycloak.
          jwk-set-uri: ${OIDC_JWK_SET_URI:${OIDC_ISSUER:http://localhost:8081/realms/lab-bug-reporter}/protocol/openid-connect/certs}
          audiences: ${OIDC_AUDIENCE:lab-bug-reporter-api}

app:
  dashboard:
    oidc-issuer: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}
    client-id: ${OIDC_CLIENT_ID:lab-dashboard}

  projects-file: ${PROJECTS_FILE:classpath:projects-dev.yaml}

  # Keycloak role names for each dashboard role, comma-separated.
  auth:
    admin-roles: ${ADMIN_ROLES:admin}
    triager-roles: ${TRIAGER_ROLES:triager}
    viewer-roles: ${VIEWER_ROLES:viewer}

  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    bucket: ${S3_BUCKET:reports}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    region: ${S3_REGION:us-east-1}
    force-path-style: ${S3_FORCE_PATH_STYLE:true}

  ingest:
    max-video-seconds: ${MAX_VIDEO_SECONDS:300}
    max-video-mb: ${MAX_VIDEO_MB:200}
    max-screenshot-mb: 10
    max-screenshots: 5
    max-context-mb: ${MAX_CONTEXT_MB:5}
