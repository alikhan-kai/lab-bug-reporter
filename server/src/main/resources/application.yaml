server:
  tomcat:
    max-swallow-size: -1

spring:
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 260MB

  application:
    name: server

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration